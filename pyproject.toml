[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tads-flood"
version = "0.1.0"
description = "Evidence-first flood exposure and settlement access analysis"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
geo = ["numpy>=2,<3", "rasterio>=1.4,<2", "shapely>=2,<3", "pyproj>=3.7,<4", "networkx>=3.4,<4"]

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-q"

